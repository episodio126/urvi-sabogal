<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin — Unidad RVII</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <header class="admin-header">
        <div class="container admin-nav">
            <h1>🏥 Panel de Administración — RVII HNASS</h1>
            <div class="nav-links">
                <a href="dashboard.html" class="active">Procedimientos</a>
                <a href="usuarios.html">Usuarios</a>
                <button onclick="logout()" class="btn btn-danger btn-sm">Cerrar Sesión</button>
            </div>
        </div>
    </header>

    <main class="container admin-content">
        <div class="admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <h3>📋 Gestión de Procedimientos</h3>
                <button class="btn btn-success" onclick="abrirModalProcedimiento()">+ Nuevo Procedimiento</button>
            </div>

            <div class="table-responsive">
                <table class="data-table" id="tablaProcedimientos">
                    <thead>
                        <tr>
                            <th>Orden</th>
                            <th>Título</th>
                            <th>Categoría</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="admin-card">
            <h3>⚙️ Configuración General</h3>
            <form id="configForm">
                <div class="form-group">
                    <label>Mensaje de Bienvenida</label>
                    <textarea id="configMensaje" class="form-control" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Teléfono de Contacto</label>
                    <input type="text" id="configTelefono" class="form-control">
                </div>
                <div class="form-group">
                    <label>Email de Contacto</label>
                    <input type="email" id="configEmail" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary" style="width: auto;">Guardar Configuración</button>
            </form>
        </div>
    </main>

    <!-- Modal Procedimiento -->
    <div class="modal-overlay" id="modalProcedimiento">
        <div class="modal">
            <h3 id="modalTitle">Nuevo Procedimiento</h3>
            <form id="procedimientoForm">
                <input type="hidden" id="procId">
                <div class="form-group">
                    <label>Título *</label>
                    <input type="text" id="procTitulo" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="procDescripcion" class="form-control" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <input type="text" id="procCategoria" class="form-control" placeholder="Ej: Angiografía, Biopsia, etc.">
                </div>
                <div class="form-group">
                    <label>URL del video de YouTube *</label>
                    <input type="url" id="procVideo" class="form-control" required placeholder="https://youtube.com/watch?v=...">
                </div>
                <div class="form-group">
                    <label>Orden (número)</label>
                    <input type="number" id="procOrden" class="form-control" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="procActivo" checked> Activo
                    </label>
                </div>

                <h4 style="margin-top: 20px; color: var(--essalud-dark);">Preguntas Frecuentes</h4>
                <div id="faqsContainer" class="faq-list-admin"></div>

                <div style="display: flex; gap: 10px; margin: 15px 0;">
                    <input type="text" id="faqPregunta" class="form-control" placeholder="Pregunta">
                    <input type="text" id="faqRespuesta" class="form-control" placeholder="Respuesta">
                    <button type="button" class="btn btn-success" onclick="agregarFaq()">+</button>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <button type="button" class="btn" style="background: var(--gray-200);" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
