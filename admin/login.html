<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Unidad de Radiología Vascular e Intervencionista</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="login-page">
    <div class="login-card">
        <h2>🔐 Acceso Administrativo</h2>
        <p style="text-align: center; color: var(--gray-600); margin-bottom: 25px;">
            Unidad de Radiología Vascular e Intervencionista<br>HNASS — EsSalud
        </p>

        <div class="alert alert-danger" id="errorAlert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="dni">DNI / Usuario</label>
                <input type="text" id="dni" class="form-control" required placeholder="Ej: admin" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
            <a href="../index.html" style="color: var(--essalud-blue);">← Volver a la página principal</a>
        </p>
    </div>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
